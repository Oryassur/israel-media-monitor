name: backfill-intl
# One-off, manual: re-classify every stored headline under the current
# INTL_VERSION and rebuild the pre-bump data/intl rows (approximate, flagged).
# Shares the "pipeline" concurrency group so it never runs alongside the
# hourly cycle. Re-run after any future INTL_VERSION bump.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Sync to latest data
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Classify under the current INTL_VERSION
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for pass in 1 2 3; do
            python scripts/backfill_intl.py classify /tmp/intl_cache.jsonl | tee /tmp/classify.log
            grep -q " 0 to classify" /tmp/classify.log && break
            sleep 30
          done
      - name: Apply, commit, push
        run: |
          git config user.name "pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin && git reset --hard origin/main
            python scripts/backfill_intl.py apply /tmp/intl_cache.jsonl
            git add data/allitems data/intl
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -m "data: intl benchmark backfilled under $(python -c 'from pipeline.common import INTL_VERSION;print(INTL_VERSION)') (rebuilt rows marked approx)"
            if git push origin main; then exit 0; fi
            echo "push rejected; re-applying on the newer data"
            sleep 15
          done
          exit 1
