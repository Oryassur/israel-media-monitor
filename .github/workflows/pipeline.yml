name: hourly-pipeline

on:
  schedule:
    # GitHub cron is best-effort and drops fires under load — two offset
    # schedules give each hour two chances. Concurrency below prevents overlap,
    # and the data model is per-run, so an hour with two runs is harmless.
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # A queued run's checkout is frozen at queue time; if the run ahead of it
      # in the concurrency group pushed data meanwhile, compute on that, not on
      # the stale snapshot — shrinks the end-of-run push race to seconds.
      - name: Sync to latest data
        run: git pull --rebase origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.run

      - name: Commit data
        run: |
          git config user.name "pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data logs
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          # A concurrent run may have pushed a conflicting rewrite of the data
          # files (they are regenerated whole each cycle, so git cannot merge
          # them). That run's data is equivalent — drop ours instead of failing;
          # the next cycle recomputes everything from live homepages anyway.
          if ! git pull --rebase origin main; then
            git rebase --abort
            echo "concurrent run already pushed conflicting data — skipping this run's commit"
            exit 0
          fi
          git push
