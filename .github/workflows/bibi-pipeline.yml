name: bibi-hourly-pipeline

on:
  schedule:
    # Offset from the israel pipeline (:07/:37) so the two workflows rarely
    # push at the same moment; both rebase before pushing anyway.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bibi-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bibi pipeline
        working-directory: bibi-media-monitor
        env:
          # dedicated token for this monitor
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_BIBI }}
        run: python -m pipeline.run

      - name: Commit data
        run: |
          git config user.name "pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bibi-media-monitor/data docs/bibi/data bibi-media-monitor/logs
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "bibi data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
