  # --- Continental Europe ---
  - name: lemonde
    display: Le Monde
    url: https://www.lemonde.fr
    country: FR
    lang: fr
    lean: left  # documented centre-left
    type: broadsheet
    selector: main  # 2026-09-15: the burger-menu tag list outranked every headline

  - name: lefigaro
    display: Le Figaro
    url: https://www.lefigaro.fr
    country: FR
    lang: fr
    lean: right  # documented conservative/right
    type: broadsheet
  - name: lacroix
    display: La Croix
    url: https://www.la-croix.com
