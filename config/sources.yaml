  - name: spiegel
    display: Der Spiegel
    url: https://www.spiegel.de
    country: DE
    lang: de
    lean: left  # documented centre-left
    type: broadsheet
    skip:  # 2026-09-15: evergreen SPIEGEL+ box and an interactive-tool block sat at ranks 1–7 for a week
      - "section[data-area='block>magletterarticles']"
      - "section[data-area^='block>topic:interaktives_tool']"

  - name: bild
    display: Bild
    url: https://www.bild.de
    country: DE
    lang: de
    lean: right  # documented right-leaning tabloid
    type: tabloid
  - name: faz
