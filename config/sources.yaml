# Western media sources monitored by the pipeline.
# lean: 3-way (left / center / right), assigned mechanically from published ratings:
#   AllSides Media Bias Ratings where the outlet is rated (Lean Left/Left -> left,
#   Center -> center, Lean Right/Right -> right); Ad Fontes Media for internationals
#   they cover; otherwise the widely documented characterization. Basis noted per source.
# weight_profile: how homepage rank maps to prominence (see pipeline/extract.py)
# selector: optional CSS scope for the main content area (falls back to full page)
# home: the outlet's home scope for domestic-vs-international classification
#   (defaults to country; pan-national outlets set it explicitly)

sources:
  # --- United States ---
  - name: nyt
    display: The New York Times
    url: https://www.nytimes.com
    country: US
    lang: en
    lean: left  # AllSides: Lean Left
    type: broadsheet
  - name: usatoday
    display: USA Today
    url: https://www.usatoday.com
    country: US
    lang: en
    lean: left  # AllSides: Lean Left
    type: broadsheet
  - name: nypost
    display: New York Post
    url: https://nypost.com
    country: US
    lang: en
    lean: right  # AllSides: Lean Right
    type: tabloid
  - name: cnn
    display: CNN
    url: https://edition.cnn.com
    country: US
    lang: en
    lean: left  # AllSides: Lean Left
    type: broadcaster
  - name: foxnews
    display: Fox News
    url: https://www.foxnews.com
    country: US
    lang: en
    lean: right  # AllSides: Right
    type: broadcaster
  - name: nbcnews
    display: NBC News
    url: https://www.nbcnews.com
    country: US
    lang: en
    lean: left  # AllSides: Lean Left
    type: broadcaster
  - name: newsweek
    display: Newsweek
    url: https://www.newsweek.com
    country: US
    lang: en
    lean: center  # AllSides: Center (March 2026 editorial review)
    type: magazine
  - name: newsnation
    display: NewsNation
    url: https://www.newsnationnow.com
    country: US
    lang: en
    lean: center  # AllSides: Center
    type: broadcaster
  - name: washexaminer
    display: Washington Examiner
    url: https://www.washingtonexaminer.com
    country: US
    lang: en
    lean: right  # AllSides: Lean Right
    type: digital
    selector: main

  # --- United Kingdom ---
