  - name: corriere
    display: Corriere della Sera
    url: https://www.corriere.it
    country: IT
    lang: it
    lean: center  # documented centrist
    type: broadsheet
    selector: main  # 2026-09-11: without it the columnist boxes ("Voci dal vicino Oriente di …") outrank every headline
  - name: ilgiornale
    display: Il Giornale
