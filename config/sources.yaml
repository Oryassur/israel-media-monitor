# Western media sources monitored by the pipeline.
# lean: 3-way (left / center / right), assigned mechanically from published ratings:
#   AllSides Media Bias Ratings where the outlet is rated (Lean Left/Left -> left,
#   Center -> center, Lean Right/Right -> right); Ad Fontes Media for internationals
#   they cover; otherwise the widely documented characterization. Basis noted per source.
# weight_profile: how homepage rank maps to prominence (see pipeline/extract.py)
# selector: optional CSS scope for the main content area (falls back to full page)
# skip: optional list of CSS selectors for blocks that are never news (promo boxes,
#   games, "for you" carousels) — removed before ranking
# lead: optional CSS selector for the visual lead story's link when the DOM puts a
#   text column before it (moved to rank 1)
# site_hook: name of an extract.SITE_HOOKS entry for outlets that embed part of the
#   front page as script data (USA Today's "More Top Stories" / "Top Headlines")
# home: the outlet's home scope for domestic-vs-international classification
#   (defaults to country; pan-national outlets set it explicitly)

sources:
  # --- United States ---
  - name: nyt
    display: The New York Times
    url: https://www.nytimes.com
    country: US
    lang: en
    lean: left  # AllSides: Lean Left
    type: broadsheet
  - name: usatoday
    display: USA Today
    url: https://www.usatoday.com
    country: US
    lang: en
    lean: left  # AllSides: Lean Left
    type: broadsheet
    selector: main
    lead: a.gnt_m_he  # the hero card is rendered first but sits second in the DOM
    skip: [".gnt_m_sb", ".gnt_m_dl", ".gnt_m_fyh"]  # sidebars (pets, photos, horoscopes), deferred-section stubs, "for you"
    site_hook: usatoday  # 2026-09-15 QA: "More Top Stories" + "Top Headlines" come from embedded JSON

  - name: nypost
    display: New York Post
    url: https://nypost.com
    country: US
    lang: en
    lean: right  # AllSides: Lean Right
    type: tabloid
    skip: [".module--related"]  # 2026-09-15 QA: "related" links under a lead are extensions of that story, not headlines

  - name: cnn
    display: CNN
    url: https://edition.cnn.com
    country: US
    lang: en
    lean: left  # AllSides: Lean Left
    type: broadcaster
    lead: ".container_spotlight-package a.container__title-url"  # the spotlight splash is the visual top story; the DOM lists the lead package first
    skip:  # 2026-09-15 QA
      - ".container_ribbon"  # topic chips strip above the lead ("Ukraine-Poland border", "The tolls of working from home")
      - ".container_spotlight-package .container__field-links"  # cards under the spotlight title are its related items

  - name: foxnews
    display: Fox News
    url: https://www.foxnews.com
    country: US
    lang: en
    lean: right  # AllSides: Right
    type: broadcaster
  - name: nbcnews
    display: NBC News
    url: https://www.nbcnews.com
    country: US
    lang: en
    lean: left  # AllSides: Lean Left
    type: broadcaster
  - name: newsweek
    display: Newsweek
    url: https://www.newsweek.com
    country: US
    lang: en
    lean: center  # AllSides: Center (March 2026 editorial review)
    type: magazine
  - name: csmonitor
    display: Christian Science Monitor
    url: https://www.csmonitor.com
    country: US
    lang: en
    lean: center  # documented centrist
    type: broadsheet
    selector: main
  - name: washexaminer
    display: Washington Examiner
    url: https://www.washingtonexaminer.com
    country: US
    lang: en
    lean: right  # AllSides: Lean Right
    type: digital
    selector: main

  # --- United Kingdom ---
  - name: bbc
    display: BBC News
    url: https://www.bbc.com/news
    country: UK
    lang: en
    lean: center  # AllSides: Center
    type: broadcaster
  - name: guardian
    display: The Guardian
    url: https://www.theguardian.com/international
    country: UK
    lang: en
    lean: left  # AllSides: Lean Left
    type: broadsheet
  - name: thetimes
    display: The Times
    url: https://www.thetimes.com
    country: UK
    lang: en
    lean: right  # documented centre-right broadsheet
    type: broadsheet
  - name: dailymail
    display: Daily Mail
    url: https://www.dailymail.co.uk/home/index.html
    country: UK
    lang: en
    lean: right  # AllSides: Right
    type: tabloid
  - name: independent
    display: The Independent
    url: https://www.independent.co.uk
    country: UK
    lang: en
    lean: left  # AllSides: Lean Left
    type: digital

  # --- International ---
  - name: dw
    display: DW (Deutsche Welle)
    url: https://www.dw.com/en/
    country: INT
    home: DE
    lang: en
    lean: center  # Ad Fontes: Middle
    type: broadcaster
  - name: euronews
    display: Euronews
    url: https://www.euronews.com
    country: INT
    home: EU
    lang: en
    lean: center  # Ad Fontes: Middle
