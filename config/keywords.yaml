# Multilingual keyword pre-filter for Israel-related coverage.
# A headline matching ANY term (case-insensitive, word-boundary where sensible)
# is flagged as a candidate; the LLM scoring pass makes the final call
# (related: true/false), so this list can err on the inclusive side.

