  - israel
  - israeli
  - israelis
  - gaza
  - gazan
  - hamas
  - hezbollah
  - netanyahu
  - idf
  - "west bank"
  - jerusalem
  - "tel aviv"
  - rafah
  - "khan younis"
  - hostage
  - hostages
  - zionis  # zionist / zionism
  - knesset
  - mossad
  - intifada
  - palestinian
  - palestinians
  - palestine

